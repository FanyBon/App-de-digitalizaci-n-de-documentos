<div class="container mx-auto p-4">
  <!-- Título y descripción -->
  <h1 class="text-2xl font-bold mb-2">Módulo Impresión de Tarjetas</h1>
  <p class="text-gray-600 mb-6">
    Busca empleados por nombre o cédula, filtra por empresa y genera un PDF con las tarjetas.
  </p>

  <!-- Controles: buscador, filtro y botones -->
  <div class="flex flex-col lg:flex-row lg:items-end gap-4 mb-6">
    <!-- Buscador -->
    <div class="flex-1 relative">
      <input
        type="text"
        placeholder="Buscar por nombre o cédula..."
        [(ngModel)]="busqueda"
        (input)="filtrarEmpleados($event)"
        class="border p-2 rounded w-full"
      />
      <ul
        *ngIf="sugerencias.length > 0"
        class="absolute bg-white border border-t-0 w-full z-10 rounded-b"
      >
        <li
          *ngFor="let sugerencia of sugerencias"
          (click)="seleccionarEmpleado(sugerencia)"
          class="p-2 hover:bg-gray-100 cursor-pointer"
        >
          {{ sugerencia.nombre }} – {{ sugerencia.cedula }}
        </li>
      </ul>
    </div>

    <!-- Dropdown de empresas -->
    <div class="w-full lg:w-1/4">
      <label class="sr-only">Seleccionar empresa</label>
      <select
        [(ngModel)]="empresaSeleccionada"
        (change)="filtrarPorEmpresa()"
        class="border p-2 rounded w-full"
      >
        <option [ngValue]="null">Mostrar todos</option>
        <option *ngFor="let empresa of empresas" [ngValue]="empresa.id">
          {{ empresa.nombre }}
        </option>
      </select>
    </div>

    <!-- Botones Generar PDF y Añadir QR -->
    <div class="flex items-center space-x-2">
      <!-- Generar PDF -->
      <button
        type="button"
        (click)="exportarPDF()"
        class="group bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-3 rounded flex items-center transition"
      >
        <svg xmlns="http://www.w3.org/2000/svg"
             class="h-6 w-6"
             fill="none"
             viewBox="0 0 24 24"
             stroke="currentColor"
             stroke-width="2">
          <path stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 6v12m6-6H6" />
        </svg>
        <span class="ml-2 hidden group-hover:inline-block whitespace-nowrap">
          Generar PDF
        </span>
      </button>

      <!-- Añadir QR Toggle -->
      <button
        type="button"
        (click)="toggleQR()"
        class="flex items-center bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-3 rounded transition"
      >
        <input
          type="checkbox"
          class="form-checkbox h-4 w-4 text-white mr-1"
          [checked]="showQR"
          readonly
        />
        Añadir QR
      </button>
    </div>
  </div>

  <!-- Tarjetas (impresión) -->
  <div id="printable" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2">
    <div
      *ngFor="let empleado of empleados"
      class="tarjeta bg-white border shadow rounded
             w-[5.4cm] h-[8.6cm]
             p-2 flex flex-col justify-between overflow-hidden"
    >
      <!-- Logo en lugar de texto -->
      <div class="flex justify-center mb-1">
        <img src="assets/procomin.png" alt="Procomin logo" class="h-8 object-contain" />
      </div>

      <!-- Nombre de la empresa -->
      <div class="text-center text-xs text-gray-700 mb-1">
        {{ empleado.empresaNombre || empleado.empresa_id }}
      </div>

      <!-- Nombre y cédula sin etiquetas -->
      <div class="text-center text-[0.7rem] space-y-0.5 mb-2">
        <p>{{ empleado.nombre }}</p>
        <p>{{ empleado.cedula }}</p>
      </div>

      <!-- Código de barras a todo ancho -->
      <div class="mb-2">
        <svg
          appBarcode="{{ empleado.codigo_barras }}"
          [bcFormat]="'CODE128'"
          [bcWidth]="1"
          [bcHeight]="40"
          [bcDisplayValue]="true"
          class="w-full h-10"
        ></svg>
      </div>

      <!-- QR o placeholder -->
      <div class="flex justify-center mb-1">
        <ng-container *ngIf="showQR; else placeholderQR">
          <canvas
            appQRCode="{{ empleado.codigo_qr }}"
            [qrWidth]="80"
            [qrMargin]="2"
          ></canvas>
        </ng-container>
        <ng-template #placeholderQR>
          <img
            src="assets/aeromexico.png"
            alt="Placeholder QR"
            class="w-40 h-20 object-contain"
          />
        </ng-template>
      </div>
    </div>
  </div>
</div>
