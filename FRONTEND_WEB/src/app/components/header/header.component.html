<header class="bg-gradient-to-r from-blue-600 to-black text-white p-4 flex justify-between items-center relative">
  <div class="flex items-center space-x-4 ml-auto">
    <!-- Usuario e imagen de perfil -->
    <div class="relative">
      <div class="flex items-center cursor-pointer" (click)="toggleUserMenu()">
        <span class="mr-2">{{ userName }}</span>
        <img src="assets/halucar.jpeg" alt="User Photo" class="w-10 h-10 rounded-full">
      </div>

      <!-- Menú de usuario desplegable -->
      <div *ngIf="showUserMenu" class="dropdown-menu absolute right-0 mt-2 text-black rounded-lg shadow-lg p-2">
        <a (click)="onUserInfo()" class="flex items-center px-4 py-2 hover:bg-gray-100 cursor-pointer">
          <i class="fas fa-user mr-2"></i> Cuenta
        </a>
        <a (click)="onSettings()" class="flex items-center px-4 py-2 hover:bg-gray-100 cursor-pointer">
          <i class="fas fa-cog mr-2"></i> Ajustes
        </a>
        <a (click)="confirmLogout()" class="flex items-center px-4 py-2 text-red-600 hover:bg-gray-100 cursor-pointer">
          <i class="fas fa-sign-out-alt mr-2"></i> Cerrar sesión
        </a>
      </div>
    </div>

    <!-- Icono de Notificaciones -->
    <div class="relative">
      <button (click)="toggleNotificationsMenu()" class="relative focus:outline-none">
        <i class="fas fa-bell"></i>
        <span *ngIf="notificationCount > 0" class="notification-badge">
          {{ notificationCount }}
        </span>
      </button>
      <div *ngIf="showNotifications" class="dropdown-menu absolute right-0 mt-2 text-black rounded-lg shadow-lg p-2">
        <a (click)="goToNotifications()" class="flex items-center px-4 py-2 hover:bg-gray-100 cursor-pointer">
          <i class="fas fa-info-circle mr-2"></i> Tienes una nueva notificación
        </a>
      </div>
    </div>
  </div>

  <!-- Modal de confirmación de cierre de sesión -->
  <div *ngIf="showLogoutConfirmModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-lg shadow-lg max-w-sm w-full text-center">
      <p class="text-black text-lg font-semibold mb-4">¿Estás seguro de que deseas cerrar sesión?</p>
      <div class="flex justify-center space-x-4 mt-6">
        <button
          (click)="onLogoutConfirmed(false)"
          class="bg-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-400 transition duration-150">
          No
        </button>
        <button
          (click)="onLogoutConfirmed(true)"
          class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 transition duration-150">
          Sí, cerrar sesión
        </button>
      </div>
    </div>
  </div>
</header>
