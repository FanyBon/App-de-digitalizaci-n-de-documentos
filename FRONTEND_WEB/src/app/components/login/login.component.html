<div class="min-h-screen flex items-center justify-center animated-gradient-bg">
  <div class="w-full max-w-md bg-white rounded-lg shadow-md p-8">
    <div class="flex justify-center mb-6">
      <img src="assets/halucar.jpeg" alt="Logo" class="w-24 h-24 rounded-full shadow-lg" />
    </div>
    <h2 class="text-2xl font-semibold text-center text-gray-800 mb-4">Iniciar Sesión</h2>

    <form (ngSubmit)="onSubmit()">
      <!-- Nombre de Usuario -->
      <div class="mb-4">
        <label for="username" class="block text-gray-700 font-medium mb-2">Nombre de Usuario</label>
        <input
          type="text"
          id="username"
          [(ngModel)]="username"
          name="username"
          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600"
          placeholder="Ingrese su nombre de usuario"
          required
        />
      </div>

      <!-- Contraseña -->
      <div class="mb-6">
        <label for="password" class="block text-gray-700 font-medium mb-2">Contraseña</label>
        <div class="relative">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            [(ngModel)]="password"
            name="password"
            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-600"
            placeholder="Ingrese su contraseña"
            required
          />
          <span
            class="absolute right-3 top-1/2 transform -translate-y-1/2 cursor-pointer text-gray-500"
            (click)="togglePassword()"
          >
            <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </span>
        </div>
      </div>

      <!-- Mensaje de Error -->
      <div *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
        <strong class="font-bold">Error:</strong>
        <span class="block sm:inline">{{ errorMessage }}</span>
      </div>

      <!-- Botón de Enviar -->
      <div class="mb-4">
        <button
          type="submit"
          class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-md transition duration-300"
        >
          Iniciar Sesión
        </button>
      </div>

      <!-- Enlace de Solicitar Acceso -->
      <div class="text-center">
        <button
          type="button"
          (click)="requestAccess()"
          class="request-access text-white bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded transition duration-300"
        >
          Solicitar acceso
        </button>
      </div>
    </form>
  </div>
</div>
