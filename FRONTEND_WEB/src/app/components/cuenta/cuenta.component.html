<div class="container mx-auto p-6 max-w-4xl">
    <h1 class="text-2xl font-bold mb-6">Información de la Cuenta</h1>
  
    <!-- Sección de Información del Usuario -->
    <div class="bg-white shadow-md rounded-lg p-6 mb-6">
      <div class="flex items-center space-x-4">
        <!-- Foto de Perfil -->
        <img src="https://via.placeholder.com/80" alt="Foto de Perfil" class="w-20 h-20 rounded-full">
        
        <!-- Información del Usuario -->
        <div>
          <h2 class="text-xl font-semibold">{{ userName }}</h2>
          <p class="text-gray-600">{{ userEmail }}</p>
        </div>
      </div>
    </div>
  
    <!-- Opciones de Edición -->
    <div class="bg-gray-100 rounded-lg p-6 space-y-4">
      <h3 class="text-lg font-semibold">Editar Información</h3>
      <form (submit)="updateUserInfo()">
        <label class="block mb-2">
          <span class="text-gray-700">Nombre</span>
          <input type="text" [(ngModel)]="userName" class="form-input mt-1 block w-full">
        </label>
  
        <label class="block mb-2">
          <span class="text-gray-700">Correo Electrónico</span>
          <input type="email" [(ngModel)]="userEmail" class="form-input mt-1 block w-full">
        </label>
  
        <button type="submit" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Guardar Cambios</button>
      </form>
    </div>
  </div>
