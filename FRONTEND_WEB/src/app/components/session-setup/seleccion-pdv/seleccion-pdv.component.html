<!-- src/app/components/session-setup/seleccion-pdv/seleccion-pdv.component.html -->

<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-blue-100">
  <div class="w-full max-w-5xl bg-white rounded-xl shadow-2xl p-8 m-4">
    
    <!-- Logo y Título -->
    <div class="text-center mb-8">
      <img src="assets/halucar.jpeg" alt="Logo Procomin" class="w-20 h-20 mx-auto mb-4 rounded-full shadow-lg" />
      <h1 class="text-3xl font-bold text-gray-800 mb-2">
        Selecciona tu Punto de Venta
      </h1>
      <div class="flex items-center justify-center text-gray-600">
        <i class="fas fa-map-marker-alt mr-2"></i>
        <p class="text-lg">
          <strong>{{ ubicacionNombre }}</strong>
        </p>
      </div>
    </div>

    <!-- Estado de carga -->
    <div *ngIf="loading" class="text-center py-12">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-600"></div>
      <p class="text-gray-600 mt-4">Cargando puntos de venta...</p>
    </div>

    <!-- Mensaje de error -->
    <div *ngIf="error && !loading" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-6">
      <strong class="font-bold">Error:</strong>
      <span class="block sm:inline ml-2">{{ error }}</span>
      <button 
        (click)="reintentar()"
        class="mt-3 w-full bg-red-600 text-white py-2 rounded hover:bg-red-700 transition">
        Reintentar
      </button>
    </div>

    <!-- Grid de PDVs -->
    <div *ngIf="!loading && !error" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
      <div
        *ngFor="let pdv of pdvs"
        (click)="seleccionarPDV(pdv)"
        class="border-2 border-gray-300 rounded-lg p-6 hover:border-blue-600 hover:shadow-xl cursor-pointer transition-all duration-300 transform hover:scale-105 bg-white"
      >
        <div class="text-center">
          <!-- Ícono del tipo de PDV (viene de BD o fallback) -->
          <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <i [class]="'fas ' + getIconoPDV(pdv) + ' text-blue-600 text-2xl'"></i>
          </div>

          <!-- Nombre del PDV -->
          <h3 class="text-xl font-bold text-gray-800 mb-2">
            {{ pdv.nombre }}
          </h3>

          <!-- Código -->
          <p class="text-gray-600 text-sm mb-2">
            <i class="fas fa-barcode mr-1"></i>
            {{ pdv.codigo }}
          </p>

          <!-- Tipo de PDV (nombre del tipo) -->
          <p class="text-gray-500 text-xs mb-3">
            {{ getTipoTexto(pdv) }}
          </p>

          <!-- Badge con el tipo (con color de BD) -->
          <span [class]="'inline-flex items-center px-3 py-1 rounded-full text-xs font-medium mb-2 ' + getTipoColorClass(pdv)">
            {{ pdv.tipo_nombre }}
          </span>

          <!-- Badge de disponible -->
          <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800">
            <span class="w-2 h-2 rounded-full bg-green-500 mr-2"></span>
            Disponible
          </span>
        </div>
      </div>
    </div>

    <!-- Mensaje si no hay PDVs -->
    <div *ngIf="!loading && !error && pdvs.length === 0" class="text-center py-12">
      <i class="fas fa-inbox text-gray-400 text-6xl mb-4"></i>
      <p class="text-gray-600 text-lg">
        No hay puntos de venta disponibles en esta ubicación.
      </p>
      <p class="text-gray-500 text-sm mt-2">
        Contacta al administrador del sistema.
      </p>
    </div>

    <!-- Botones de navegación -->
    <div class="mt-8 flex flex-col sm:flex-row gap-4 justify-center">
      <button
        (click)="volverUbicacion()"
        class="inline-flex items-center justify-center px-6 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition-colors duration-300"
      >
        <i class="fas fa-arrow-left mr-2"></i>
        Cambiar Ubicación
      </button>
      
      <button
        (click)="cerrarSesion()"
        class="inline-flex items-center justify-center px-6 py-3 bg-red-100 text-red-700 rounded-lg hover:bg-red-200 transition-colors duration-300"
      >
        <i class="fas fa-sign-out-alt mr-2"></i>
        Cerrar Sesión
      </button>
    </div>

  </div>
</div>
